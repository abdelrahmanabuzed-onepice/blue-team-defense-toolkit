[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blue-team-defense-toolkit"
version = "1.0.0"
description = "Defensive cybersecurity, endpoint forensics, malware triage, and integrity monitoring toolkit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Abdelrahman Abouzed", email = "abdelrahman.abouzed@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.scripts]
blueteam-cli = "blue_team_defense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
